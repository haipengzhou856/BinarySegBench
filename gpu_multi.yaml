compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU
downcast_bf16: 'no'
gpu_ids:  0,1,2,3       # specify the GPUs to use, e.g., '0,1,2,3' for 4 GPUs
machine_rank: 0
main_training_function: main
mixed_precision: fp16
num_machines: 1
num_processes: 4         # the number of GPUs, must match the number of gpu_ids
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
